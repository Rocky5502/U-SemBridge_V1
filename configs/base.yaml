project: U-SemBridge
seed: 42
output_dir: outputs
candidate_counts: [1, 3, 5]
temperatures: [0.0, 0.7]
max_new_tokens: 2048
solver:
  backend: z3
  timeout_ms: 10000
calibration:
  method: logistic
  tune_on: validation_only
selective_policy:
  verify_max_risk: 0.25
  repair_max_risk: 0.55
  clarify_max_risk: 0.80
metrics:
  - answer_accuracy
  - executable_rate
  - brier
  - ece
  - auroc_error_detection
  - aurc
  - latency_ms
